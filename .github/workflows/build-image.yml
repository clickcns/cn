name: Build Image

# 이미지 하나를 빌드해 GHCR에 올리고, cns-k8s 의 projects/cn/values.yaml 태그를 갱신한다.
# docker-server.yml · docker-web.yml · docker-web-admin.yml 이 target 만 바꿔 부른다.
# 배포는 ArgoCD 앱 cn(projects/cn)이 values 변경을 보고 동기화한다.

on:
  workflow_call:
    inputs:
      target:
        description: "Dockerfile target (server | web | web-admin)"
        required: true
        type: string
      chart-key:
        description: "projects/cn/values.yaml 의 서브차트 키 (cn-server | cn-web | cn-web-admin)"
        required: true
        type: string
    secrets:
      K8S_UPDATE_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 태그는 커밋 SHA 7자리. 세 이미지가 같은 커밋으로 묶인다.
      - name: Compute image name and tag
        id: tag
        run: |
          echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.target }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}

  update-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cns-k8s
        uses: actions/checkout@v6
        with:
          repository: clickcns/cns-k8s
          token: ${{ secrets.K8S_UPDATE_TOKEN }}
          ref: main

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      # 세 이미지 잡이 같은 파일을 동시에 고칠 수 있어 fetch + reset 후 다시 쓰는 재시도 루프로 충돌을 흡수한다.
      - name: Update image tag and push with retry
        env:
          VALUES_PATH: projects/cn/values.yaml
          CHART_KEY: ${{ inputs.chart-key }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "=== Attempt $i of 5 ==="
            git fetch origin main
            git reset --hard origin/main
            test -f "$VALUES_PATH" || { echo "ERROR: $VALUES_PATH 없음"; exit 1; }
            yq -i ".\"${CHART_KEY}\".image.repository = \"${IMAGE}\" | .\"${CHART_KEY}\".image.tag = \"${TAG}\"" "$VALUES_PATH"
            git add "$VALUES_PATH"
            if git diff --cached --quiet; then
              echo "No changes needed"
              exit 0
            fi
            git commit -m "chore(${CHART_KEY}): update image tag to ${TAG}"
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            [ "$i" -lt 5 ] && sleep $((i * 2 + RANDOM % 3))
          done
          echo "ERROR: Failed after 5 attempts"
          exit 1
