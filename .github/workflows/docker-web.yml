name: Docker (web)

# 현장 웹 이미지 → GHCR → cns-k8s projects/cn 태그 갱신. 실제 작업은 build-image.yml.
# main 에 push 하면 운영(cn.clickcns.com)으로 나간다.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # 개발 지침 문서(/dev)도 현장 웹 이미지에 들어 있다.
      - "docs/dev-guide.html"
      - "packages/shared-types/**"
      - "packages/api-client/**"
      - "packages/typescript-config/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/docker-web.yml"
  workflow_dispatch:

concurrency:
  group: docker-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      target: web
      chart-key: cn-web
    secrets:
      K8S_UPDATE_TOKEN: ${{ secrets.K8S_UPDATE_TOKEN }}
