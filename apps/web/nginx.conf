# 현장 웹(PWA) — cn.clickcns.com/ . /api 는 인그레스가 서버로, /admin 은 관리 웹으로 보낸다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 파일 이름에 해시가 붙은 빌드 결과는 오래 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 서비스 워커·매니페스트는 매번 새로 확인한다(새 버전 알림이 제때 뜨게).
    location ~ ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        # 기본 mime.types 에 webmanifest 가 없다.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html(클라이언트 라우터). index.html 은 캐시하지 않는다.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
