# 관리 웹 — cn.clickcns.com/admin . 빌드 결과는 /usr/share/nginx/html/admin 에 있고
# (vite base /admin/), 인그레스는 /admin 경로를 그대로 이 서비스로 넘긴다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # 리다이렉트를 상대 경로로(인그레스 뒤에서 http:// 절대 주소로 한 번 더 돌지 않게).
    absolute_redirect off;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /admin {
        return 301 /admin/;
    }

    # 파일 이름에 해시가 붙은 빌드 결과는 오래 캐시한다.
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: 없는 경로는 /admin/index.html(클라이언트 라우터). index.html 은 캐시하지 않는다.
    location /admin/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /admin/index.html;
    }
}
