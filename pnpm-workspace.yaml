packages:
  - "apps/*"
  - "packages/*"

# 설치 스크립트(postinstall 등) 실행 허용 목록.
# pnpm 11부터 승인되지 않은 빌드 스크립트가 있으면 install이 실패한다.
allowBuilds:
  # Prisma 엔진 바이너리 다운로드 - 필수
  "@prisma/engines": true
  prisma: true
  # 런타임에 불필요한 스크립트 (텔레메트리·선택적 네이티브 빌드)
  "@nestjs/core": false
  "@scarf/scarf": false
  # 버전 호환 확인용 postinstall. gRPC(STT 클라이언트) 동작에는 불필요
  protobufjs: false
  # tsx(시드 스크립트 실행)가 쓰는 트랜스파일러 바이너리
  esbuild: true
